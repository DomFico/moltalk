<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MolTalk</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6; --chip: #f2f2f4;
    --accent: #0b6bcb; --wedge: #b4232a; --dash: #1f5fa8; --canvas: #ffffff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1f1f21; --fg: #ececf1; --muted: #a1a1aa; --line: #34343a; --chip: #2a2a2e;
    --accent: #6cb4ff; --wedge: #ff8a8f; --dash: #8ab8ff; --canvas: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { overflow: hidden; }  /* the page itself never scrolls; only the details box below does */
  :root[data-compact] main { min-height: 0; padding: 0; }
  main { padding: 26px 16px 14px; min-height: 280px; display: flex; flex-direction: column; max-height: var(--max-h, none); }
  main > .stage { flex: 0 0 auto; }
  .details { flex: 0 1 auto; min-height: 0; max-height: 132px; overflow-y: auto; margin-top: 8px; padding-right: 6px;
             scrollbar-width: thin; overscroll-behavior: contain; }
  .details > :first-child { margin-top: 0; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 12px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .formula { color: var(--muted); }
  code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .ids { margin: -4px 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
  .ids .k { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .ids .v { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .ids .name { color: var(--fg); }
  .ids .unavailable { font-style: italic; }
  .seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; }
  .seg > span { padding: 0 8px; color: var(--muted); }
  .seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--chip); font-weight: 600; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .canvas { background: var(--canvas); border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
  .canvas svg { display: block; width: 100%; height: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .chips li { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .chips li.warn { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  ul.bonds { margin: 0; padding-left: 18px; }
  ul.bonds li { margin: 2px 0; }
  .wedge { color: var(--wedge); font-weight: 600; }
  .dash { color: var(--dash); font-weight: 600; }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .warn-text { color: var(--fg); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 0 0 12px; }
  header .toolbar { margin: 0 0 0 auto; }  /* stereoisomer header keeps its inline toolbar */
  button { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--chip); border: 1px solid var(--line);
           border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .card .canvas { border: 0; }
  .card p { margin: 6px 2px 0; font-size: 12.5px; }
  .error { border: 1px solid var(--wedge); border-radius: 10px; padding: 10px 12px; }
  .empty { color: var(--muted); }
  .liftable { position: relative; touch-action: none; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; overscroll-behavior: contain; }
  .liftable:active { cursor: grabbing; }
  .liftable.loading { cursor: progress; }
  .liftable:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .liftable > svg { display: block; width: 100%; height: auto; }
  .liftable.fitted > svg { height: 100%; }  /* height set by fitInline(); the drawing letterboxes inside */
  .liftable > svg.lift { position: absolute; inset: 0; height: 100%; }
  /* One row: the hint takes what is left, and every button sits together, flush right, never split across lines. */
  .lifthint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .lifthint > .hint { flex: 1 1 220px; min-width: 0; }
  .lifthint .tools { margin-left: auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; white-space: nowrap; }
  .lifthint .tools button { min-width: 34px; }
  .lifthint .tools .label { color: var(--muted); }
  /* Viewer (fullscreen) mode: everything fits the window; nothing scrolls. Insets keep clear of the host's title bar. */
  :root[data-mode="viewer"], :root[data-mode="viewer"] body { height: 100%; overflow: hidden; }
  /* ChatGPT draws its own bars over the viewer: a title bar at the top on phones and the "Ask ChatGPT" box at the
     bottom everywhere. Keep clear of both (the host's reported insets, or these measured minimums if larger), and put
     our controls at the top, under the header, where nothing covers them. */
  :root[data-mode="viewer"] { --clear-top: 8px; --clear-bottom: 88px; }
  @media (max-width: 600px) { :root[data-mode="viewer"] { --clear-top: 104px; --clear-bottom: 128px; } }
  /* Phones and tablets, detected by touch rather than width (the iPhone viewer was not narrower than 600 px). */
  :root[data-mode="viewer"][data-touch] { --clear-top: 132px; --clear-bottom: 140px; }
  :root[data-mode="viewer"] main { height: 100vh; height: 100dvh; max-height: none; display: flex; flex-direction: column; overflow: hidden;
    padding: max(var(--safe-top, 0px), var(--clear-top)) calc(var(--safe-right, 0px) + 12px)
             max(var(--safe-bottom, 0px), var(--clear-bottom)) calc(var(--safe-left, 0px) + 12px); }
  :root[data-mode="viewer"] header { margin-bottom: 6px; }
  :root[data-mode="viewer"] main > .toolbar { margin-bottom: 6px; gap: 6px; }
  /* Keep the viewer's toolbar on one row on a phone, so the drawing keeps its height. */
  :root[data-mode="viewer"] main > .toolbar button { padding: 3px 7px; font-size: 12px; }
  :root[data-mode="viewer"] main > .toolbar .seg > span { display: none; }
  :root[data-mode="viewer"] main > .toolbar .seg > button:first-of-type { border-left: 0; }
  :root[data-mode="viewer"] .ids { margin: 0 0 6px; }
  :root[data-mode="viewer"] .ids .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; line-height: 1.5; }
  :root[data-mode="viewer"] .stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  :root[data-mode="viewer"] .lifthint { order: -1; margin: 0 0 6px; }
  :root[data-mode="viewer"] .lifthint > span:first-child { display: none; }
  :root[data-mode="viewer"] .liftable { flex: 1 1 auto; min-height: 0; }
  :root[data-mode="viewer"] .liftable > svg { width: 100%; height: 100%; }
  :root[data-mode="viewer"] .details, :root[data-mode="viewer"] .enter-viewer { display: none; }
  .exit-viewer { display: none; }
  .saveas { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 70vh; overflow: auto; z-index: 10;
            background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
  .saveas header { margin-bottom: 6px; }
  .saveas header button { margin-left: auto; }
  .saveas img { display: block; max-width: 100%; max-height: 40vh; margin: 6px auto; background:
                repeating-conic-gradient(#e8e8ea 0 25%, #ffffff 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
  .saveas textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .filecard { display: grid; gap: 8px; }
  .filecard .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .filecard .meta { color: var(--muted); font-size: 12.5px; }
  .filecard .status { color: var(--muted); font-size: 12.5px; }
  :root[data-mode="viewer"] .lifthint .tools .label { display: none; }
  :root[data-mode="viewer"] .exit-viewer { display: inline-block; }
</style>
</head>
<body>
<main id="root"><p class="empty">Waiting for a molecule…</p></main>
<script>
(() => {
  "use strict";
  const root = document.getElementById("root");
  const pending = new Map();
  let nextId = 1;
  let lastInput = null;
  let lastResult = null;
  const conformers = new Map();
  const views = new Map();
  let liftSnapshot = null;
  let stereoLabels = "off";  // clean drawing by default; the viewer's Stereo control turns labels on  // "specified" | "all" | "off"; survives redraws like the lone-pair setting
  let hostCaps = {};
  let showLonePairs = false;  // survives redraws (hydrogens, numbering)  // per molecule: rotation, lift, zoom and pan survive redraws (hydrogens, atom numbers)

  // ---- MCP Apps bridge (JSON-RPC over postMessage), with window.openai as a fallback ----
  function rpc(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => { if (pending.delete(id)) reject(new Error(method + " timed out")); }, 30000);
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id != null && !msg.method && pending.has(msg.id)) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "Request failed")) : resolve(msg.result);
      return;
    }
    if (msg.id != null && msg.method) {
      // A request from the host (e.g. ping, teardown): always answer so the host never waits on us.
      const known = msg.method === "ping" || msg.method === "ui/resource-teardown";
      window.parent.postMessage(known ? { jsonrpc: "2.0", id: msg.id, result: {} }
        : { jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "Method not found" } }, "*");
      return;
    }
    if (msg.method === "ui/notifications/tool-input") lastInput = (msg.params && msg.params.arguments) || lastInput;
    if (msg.method === "ui/notifications/tool-result") render(msg.params);
    if (msg.method === "ui/notifications/host-context-changed") applyHostContext(msg.params);
  }, { passive: true });

  async function callTool(name, args) {
    if (window.openai && typeof window.openai.callTool === "function" && !bridgeReady) {
      return window.openai.callTool(name, args);
    }
    return rpc("tools/call", { name, arguments: args });
  }

  let bridgeReady = false;
  rpc("ui/initialize", {
    appInfo: { name: "moltalk", version: "1.0.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then((result) => {
    bridgeReady = true;
    hostCaps = (result && result.hostCapabilities) || {};
    applyHostContext(result && result.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => {});

  function fromOpenAiGlobals() {
    const o = window.openai;
    if (!o) return;
    applyTheme(o.theme);
    if (o.displayMode) setDisplayMode(o.displayMode);
    if (o.safeArea) setInsets(o.safeArea.insets || o.safeArea);
    if (o.maxHeight) setMaxHeight(o.maxHeight, true);
    if (o.toolInput) lastInput = o.toolInput;
    if (o.toolOutput && !lastResult) render({ structuredContent: o.toolOutput, _meta: o.toolResponseMetadata || {} });
  }
  window.addEventListener("openai:set_globals", fromOpenAiGlobals, { passive: true });

  function applyHostContext(ctx) {
    if (!ctx) return;
    applyTheme(ctx.theme);
    if (ctx.displayMode) setDisplayMode(ctx.displayMode);
    if (ctx.safeAreaInsets) setInsets(ctx.safeAreaInsets);
    const dims = ctx.containerDimensions;
    if (dims && (dims.maxHeight || dims.height)) setMaxHeight(dims.maxHeight || dims.height, true);
  }
  let maxHeight = 0;
  function setMaxHeight(px, fromHost) {
    // The host's height limit for the inline widget: fit inside it rather than make the host add a scroll bar.
    if (fromHost) hostCapKnown = true;
    if (+px > 200) {
      maxHeight = Math.floor(+px);
      document.documentElement.style.setProperty("--max-h", `${maxHeight}px`);
      fitInline();
    }
  }
  const DETAILS_MIN = 72;
  const INLINE_DRAWING_MAX = 420;  // always leave about three lines of the details box visible
  function fitInline() {
    // Inline under a height limit: shrink the drawing (never the controls) so header, drawing, controls and a
    // strip of the scrollable details all fit. The viewer lays itself out with CSS instead.
    const box = root.querySelector(".liftable");
    if (!box) return;
    const viewer = document.documentElement.dataset.mode === "viewer";
    box.classList.remove("fitted");
    box.style.height = "";
    if (viewer) { reportSize(); return; }
    const natural = box.getBoundingClientRect().height;
    // Inline, the drawing is never taller than INLINE_DRAWING_MAX: its natural height grows with the width, and a
    // wide host window (Codex desktop) made it taller than the host would show. The viewer shows it full size.
    let room = INLINE_DRAWING_MAX;
    if (maxHeight) {
      const details = root.querySelector(".details");
      const needed = details ? Math.min(details.scrollHeight, DETAILS_MIN) : 0;
      const others = root.getBoundingClientRect().height - natural - (details ? details.getBoundingClientRect().height : 0);
      room = Math.min(room, maxHeight - others - needed);
    }
    if (room < natural) {
      box.classList.add("fitted");
      box.style.height = `${Math.max(160, Math.floor(room))}px`;
    }
    reportSize();
  }
  window.addEventListener("resize", () => fitInline(), { passive: true });
  function setDisplayMode(mode) {
    const viewer = mode === "fullscreen" || mode === "pip";
    document.documentElement.dataset.mode = viewer ? "viewer" : "inline";
    requestAnimationFrame(fitInline);
    // Coming back inline, the content height has not changed, so nothing would re-report it; do it explicitly.
    requestAnimationFrame(() => requestAnimationFrame(reportSize));
    setTimeout(reportSize, 300);
    setTimeout(reportSize, 1000);
  }
  function setInsets(insets) {
    if (!insets) return;
    const style = document.documentElement.style;
    for (const side of ["top", "right", "bottom", "left"]) style.setProperty(`--safe-${side}`, `${Math.max(0, +insets[side] || 0)}px`);
    document.documentElement.dataset.insets = "1";
  }
  function applyTheme(theme) {
    if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
  }

  let reported = 0, hostCapKnown = false, clipTimer = null, clipSeen = 0;
  function reportSize() {
    // Inline only: in the viewer the host sizes us and the page is the window. Never report less than 280 px,
    // so a bad viewport during the fullscreen -> inline transition (a known iOS host issue) cannot collapse us.
    if (document.documentElement.dataset.mode === "viewer") return;
    const floor = document.documentElement.dataset.compact ? 0 : 280;
    const height = Math.max(floor, Math.ceil(root.getBoundingClientRect().height));
    notify("ui/notifications/size-changed", { height });
    if (window.openai && typeof window.openai.notifyIntrinsicHeight === "function") window.openai.notifyIntrinsicHeight(height);
    reported = height;
    checkClipping();
  }
  // Some hosts cap the inline frame without telling us the limit (no containerDimensions.maxHeight or
  // window.openai.maxHeight): the frame stays shorter than the height we asked for and the bottom is cut off. If
  // that holds for over a second (two checks, so a host still resizing is not mistaken for a cap), take the frame's
  // height as the limit and shrink the drawing to fit.
  function checkClipping() {
    clearTimeout(clipTimer);
    clipTimer = setTimeout(() => {
      const inner = window.innerHeight;
      if (hostCapKnown || document.documentElement.dataset.mode === "viewer" || inner < 280 || inner >= reported - 4) {
        clipSeen = 0;
        return;
      }
      if (clipSeen && Math.abs(clipSeen - inner) < 2) {
        clipSeen = 0;
        setMaxHeight(inner);
      } else {
        clipSeen = inner;
        checkClipping();
      }
    }, 600);
  }
  new ResizeObserver(reportSize).observe(root);

  // ---- Saving files: the MCP Apps host download (ui/download-file) first, then the browser ----
  // file: { name, mime, text } or { name, mime, base64 }. The host usually confirms with the user; denial is normal.
  async function saveFile(file, preview) {
    if (bridgeReady && hostCaps.downloadFile) {
      const resource = { uri: "file:///" + file.name, mimeType: file.mime };
      if (file.text != null) resource.text = file.text; else resource.blob = file.base64;
      try {
        const result = await rpc("ui/download-file", { contents: [{ type: "resource", resource }] });
        return result && result.isError ? "cancelled" : "saved";
      } catch (err) { /* the host refused the request outright: fall back below */ }
    }
    // Ordinary download. A sandboxed frame may silently block it, and there is no way to tell, so also offer the
    // file in a panel the user can always save from (right-click / long-press an image, or copy the text).
    const blob = file.text != null ? new Blob([file.text], { type: file.mime })
      : new Blob([Uint8Array.from(atob(file.base64), (c) => c.charCodeAt(0))], { type: file.mime });
    try {
      const a = el("a", { href: URL.createObjectURL(blob), download: file.name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    } catch (err) { /* blocked: the panel below still works */ }
    showSaveAs(file, preview);
    return "fallback";
  }

  function showSaveAs(file, preview) {
    const old = document.querySelector(".saveas");
    if (old) old.remove();
    const close = el("button", { type: "button", "aria-label": "Close" }, "Close");
    const panel = el("div", { class: "saveas", role: "dialog", "aria-label": "Save " + file.name },
      el("header", {}, el("strong", {}, file.name), close));
    if (preview) {
      panel.append(el("p", { class: "note" }, "If the download did not start, right-click (or long-press) the image and choose Save image."),
                   el("img", { src: preview, alt: file.name }));
    } else {
      const area = el("textarea", { readonly: "", spellcheck: "false" });
      area.value = file.text != null ? file.text : "";
      const copy = el("button", { type: "button" }, "Copy");
      copy.addEventListener("click", async () => {
        area.select();
        try { await navigator.clipboard.writeText(area.value); copy.textContent = "Copied"; }
        catch (err) { copy.textContent = document.execCommand && document.execCommand("copy") ? "Copied" : "Select and copy"; }
      });
      panel.append(el("p", { class: "note" }, `If the download did not start, copy the contents and save them as ${file.name}.`), area,
                   el("div", { class: "actions" }, copy));
    }
    close.addEventListener("click", () => panel.remove());
    document.body.append(panel);
  }

  // ---- Rendering ----
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v; else node.setAttribute(k, v);
    }
    for (const child of children) if (child != null) node.append(child);
    return node;
  }

  // RDKit SVG is generated server-side, but strip anything active before inserting it.
  function safeSvg(text) {
    const doc = new DOMParser().parseFromString(String(text || ""), "image/svg+xml");
    const svg = doc.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return null;
    svg.querySelectorAll("script, foreignObject, iframe, a, use").forEach((n) => n.remove());
    for (const n of [svg, ...svg.querySelectorAll("*")]) {
      for (const attr of [...n.attributes]) {
        const name = attr.name.toLowerCase();
        if (name.startsWith("on") || name === "href" || name === "xlink:href") n.removeAttribute(attr.name);
      }
    }
    const w = svg.getAttribute("width"), h = svg.getAttribute("height");
    if (!svg.getAttribute("viewBox") && w && h) svg.setAttribute("viewBox", `0 0 ${parseFloat(w)} ${parseFloat(h)}`);
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("role", "img");
    return document.importNode(svg, true);
  }

  function canvas(svgText, alt) {
    const svg = safeSvg(svgText);
    const box = el("div", { class: "canvas" });
    if (svg) { svg.setAttribute("aria-label", alt); box.append(svg); }
    else box.append(el("p", { class: "empty" }, "Drawing unavailable."));
    return box;
  }

  function render(result) {
    try {
      renderResult(result);
    } catch (err) {
      // Never leave a blank panel: show what went wrong.
      root.replaceChildren(el("div", { class: "error" }, el("strong", {}, "Viewer error. "), String(err && err.message || err)));
      reportSize();
    }
  }

  function renderResult(result) {
    if (!result) return;
    lastResult = result;
    const data = result.structuredContent || {};
    const meta = result._meta || {};
    root.replaceChildren();
    if (result.isError) {
      const text = (result.content || []).map((c) => c.text).filter(Boolean).join(" ") || "The tool reported an error.";
      root.append(el("div", { class: "error" }, el("strong", {}, "No structure drawn. "), text));
    } else if (data.kind === "stereoisomers") {
      renderIsomers(data, meta);
    } else if (data.kind === "file") {
      renderFile(data, meta, result);
    } else if (data.repeat_of_previous) {
      // ChatGPT sometimes re-sends the first draw of a chat although the drawing is already shown just above:
      // show nothing rather than a second copy (or a note about the host's repeat).
      document.documentElement.dataset.compact = "1";
    } else if (data.kind === "molecule" || data.analysis) {
      renderMolecule(data, meta);
    } else {
      root.append(el("p", { class: "empty" }, "No molecule in this result."));
    }
    reportSize();
  }

  function renderMolecule(data, meta) {
    const a = data.analysis || {};
    // Numbers: IUPAC locants (when they could be determined), atom indices, or none.
    const shown = data.numbering_shown || (data.atom_indices_shown === false ? "none" : "indices");
    const toggle = el("span", { class: "seg", role: "group", "aria-label": "Atom numbers" }, el("span", {}, "Numbers"));
    const hasLocants = data.locants && Object.keys(data.locants).length > 0;
    for (const [mode, text] of [["iupac", "IUPAC"], ["indices", "Index"], ["none", "Off"]]) {
      const b = el("button", { type: "button", "aria-pressed": String(shown === mode) }, text);
      if (mode === "iupac" && !hasLocants) {
        b.disabled = true;

      this.fs = lengths.length ? Math.max(9, Math.min(30, 0.42 * this.bondPx)) : 0.42 * this.bondPx / 0.72;

    bindInput() {

    }

    // Zoom and pan act on both the flat drawing and the rotated one, through the SVG viewBox.
    // Buttons, keys and the wheel glide to a target zoom; pinching follows the fingers directly.
    setZoom(z, immediate) {
      this.targetZoom = Math.min(6, Math.max(0.5, z));

    // Lone pairs on the flat drawing: an overlay in the RDKit SVG's own coordinates (so zoom and pan apply).
    updateLonePairs() {
      this.flatSvg.querySelectorAll("[data-charge-glyph]").forEach((n) => { n.style.display = ""; });
      const old = this.flatSvg.querySelector("g.lone-pairs");
      if (old) old.remove();

            if (a !== i && b !== i) continue;

          const box = this.flatLabelBox(i, x, y);

          // letter, so "Cl" extends to the right of the atom position).
          const [cx, cy] = this.symbolCentre(i, x, y, box);
          const domains = drawElectrons(g, cx, cy, info, angles, hLeft, box, ELEMENT_COLORS[this.elementOf(i)] || INK);
          if (info.charge) {

    }
    // Stereo labels on the flat drawing are RDKit's own annotations (class CIP_Code): R/S and E/Z where the input
    // specifies them, and "(?)" at stereocentres and double bonds it leaves open. Each glyph is attributed to the
    // nearest labelled atom or bond (its midpoint), so "Specified" can hide just the "(?)" ones; "All" shows both;
    // "Off" hides every stereo label.
    updateStereoLabels() {
      if (!this.cipGlyphs) {
        const px = this.meta.atom_px, a = this.data.analysis || {}, summary = a.stereo_summary || {};
        const mid = ([i, j]) => [(px[i][0] + px[j][0]) / 2, (px[i][1] + px[j][1]) / 2];
        const anchors = [
          ...(a.stereocenters || []).map((c) => ({ at: px[c.atom_index], open: false })),
          ...(summary.unspecified_atoms || []).map((i) => ({ at: px[i], open: true })),
          ...(a.double_bond_stereo || []).map((b) => ({ at: mid(b.atom_indices), open: false })),

      if (this.lifted) this.paint();
    }

    // ---- Image export: exactly what is on screen (rotation, zoom, pan, hydrogens, labels, lone pairs), with a
    // transparent background. The rotated view cuts gaps with background-coloured strokes (halos) and label
    // backings; on a transparent image those would show as white marks, so they become real cut-outs (masks).
    exportSvg() {

        for (const r of out.querySelectorAll("rect")) {  // RDKit's white page background
          const style = (r.getAttribute("style") || "") + (r.getAttribute("fill") || "");

        }

      }
      // Crop to the drawing plus a small margin, within what is visible (so a deliberate zoom-in still crops).
      const [vx, vy, vw, vh] = out.getAttribute("viewBox").split(/\s+/).map(Number);
      let box = null;
      for (const node of (this.lifted ? live.querySelector("g") || live : live).children) {
        if (node.tagName === "rect" && !this.lifted && /#fff/i.test((node.getAttribute("style") || "") + (node.getAttribute("fill") || ""))) continue;
        if (node.tagName === "defs" || node.tagName === "title" || node.style.display === "none") continue;
        let b;
        try { b = node.getBBox(); } catch (err) { continue; }
        if (!b.width && !b.height) continue;
        box = box ? [Math.min(box[0], b.x), Math.min(box[1], b.y), Math.max(box[2], b.x + b.width), Math.max(box[3], b.y + b.height)]
                  : [b.x, b.y, b.x + b.width, b.y + b.height];

      let [x0, y0, x1, y1] = [vx, vy, vx + vw, vy + vh];

        x0 = Math.max(x0, box[0] - pad); y0 = Math.max(y0, box[1] - pad);
        x1 = Math.min(x1, box[2] + pad); y1 = Math.min(y1, box[3] + pad);
      }
      out.setAttribute("viewBox", `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1 - x0).toFixed(1)} ${(y1 - y0).toFixed(1)}`);
      out.setAttribute("width", ((x1 - x0) * this.zoom).toFixed(1));
      out.setAttribute("height", ((y1 - y0) * this.zoom).toFixed(1));

    cutErasers(out, live) {

    async exportImage(kind, button) {

    // With lone pairs shown, a charge is written outside the dots, like an exponent: RDKit's own superscript sign
    // (the small glyph raised above the atom's centre) is hidden and the charge is drawn in the largest open gap
    // around the atom, nearest the upper right, beyond the dots.
    chargeOutside(g, i, x, y, charge, blockers, pairAngles, box) {
      const glyphs = [...this.flatSvg.querySelectorAll(`path[class="atom-${i}"]`)].map((n) => ({ n, b: n.getBBox() }));
      const tallest = Math.max(0, ...glyphs.map(({ b }) => b.height));
      for (const { n, b } of glyphs) {

      // lone pair there just pushes the charge outward, past the pairs, rather than onto the far side of the atom.
      const near = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
      const deg = Math.PI / 180;
      const candidates = [-45, -30, -60, -15, -75, 0, -90, -120, 30, -150, 180].map((d) => d * deg);
      const best = candidates.find((t) => !blockers.some((b) => near(t, b) < 0.5)) ?? -Math.PI / 4;
      const h = box.h, lp = lpRadius(box, best);
      const pairThere = pairAngles.some((a) => near(a, best) < 0.6);
      const r = (pairThere ? lp + 0.32 * h : lp - 0.1 * h) + 0.45 * h;
      const t = svgEl("text", { x: (x + r * Math.cos(best)).toFixed(1), y: (y + r * Math.sin(best)).toFixed(1),
        "text-anchor": "middle", "dominant-baseline": "central", "font-size": (0.75 * h).toFixed(1),
        "font-family": "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif", fill: ELEMENT_COLORS[this.elementOf(i)] || INK });

    // Centre of the element symbol's glyphs: the main row (not a raised charge or a subscript), and only glyphs
    // within the symbol's own width of the atom position (not an H written beside it).
    symbolCentre(i, x, y, box) {

    flatLabelBox(i, x, y) {

    modelFrame() { return (this.model && this.model.to_heavy_frame) || IDENTITY; }
    remember() {

      this.paint();
      this.remember();

    resetAll() {

      this.applyView();
      this.flatten();
    }

    rotate(ax, ay, distance) {
      if (!this.lifted) {
        this.lifted = true;
        this.flatSvg.style.visibility = "hidden";
        this.svg.style.display = "block";
        this.reset.disabled = false;
        this.showNotes();
        this.prefetchOther();
      }
      this.travel += distance;
      this.s = Math.max(this.s, smooth(Math.min(1, this.travel / LIFT_DISTANCE)));

        this.flatSvg.style.visibility = "visible";

    }

    showNotes() {

      this.notes.replaceChildren(el("p", { class: "note" }, el("strong", {}, "Rotated view. "), m.note,
        (this.data.hydrogens_shown ? "" : " Hidden hydrogens stay hidden;") + " the wedges listed below describe the flat drawing."));
      if (m.warning) this.notes.append(el("p", { class: "note warn-text" }, el("strong", {}, "Model caveat. "), m.warning));

    }

    draw() {
      if (this.frame) return;
      this.frame = requestAnimationFrame(() => { this.frame = null; this.paint(); });
    }

    // Screen position and depth of every atom for the current rotation and lift amount.
    project() {
      const { atoms } = this.model, R = this.R, c = this.centre, s = this.s, k = this.k;
      return atoms.map((a, i) => {
        const x = a.xyz[0] - c[0], y = a.xyz[1] - c[1], z = a.xyz[2] - c[2];
        const rx = R[0][0] * x + R[0][1] * y + R[0][2] * z;
        const ry = R[1][0] * x + R[1][1] * y + R[1][2] * z;
        const rz = R[2][0] * x + R[2][1] * y + R[2][2] * z;

      });
    }

    label(atom, pts, i) {
      // ChemDraw/RDKit convention: carbons are implicit unless charged or isolated.
      const neighbours = this.neighbours[i];
      if (atom.element === "C" && !atom.charge && neighbours.length) return null;
      let mean = 0;
      for (const j of neighbours) mean += pts[j].x - pts[i].x;
      return { symbol: atom.element, h: atom.h, hLeft: neighbours.length > 0 && mean > 0, charge: atom.charge };
    }

    // Fixed 3D geometry for the rotated view, computed once per model: the most open direction around each atom
    // (where charges and R/S or number tags sit, like a hydrogen would), a fixed 3D axis to split each lone pair's two
    // dots along, and each double bond's in-plane offset. Everything then turns with the molecule instead of
    // keeping a fixed place on screen.
    geometry() {
      if (this.geo) return this.geo;
      const m = this.model, xyz = m.atoms.map((a) => a.xyz);
      const sub = (u, v) => [u[0] - v[0], u[1] - v[1], u[2] - v[2]];
      const add = (u, v) => [u[0] + v[0], u[1] + v[1], u[2] + v[2]];
      const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
      const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const len = (u) => Math.hypot(u[0], u[1], u[2]);
      const unit = (u) => { const l = len(u); return l > 1e-9 ? [u[0] / l, u[1] / l, u[2] / l] : null; };
      const anyPerp = (u) => unit(cross(u, Math.abs(u[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]));
      const lps = m.lone_pair_dirs || {};
      const open = [], pairAxes = [];
      m.atoms.forEach((_, i) => {
        const bonds = this.neighbours[i].map((j) => unit(sub(xyz[j], xyz[i]))).filter(Boolean);
        const dirs = lps[String(i)] || [];
        let o = [0, 0, 0];
        for (const v of bonds.concat(dirs)) o = sub(o, v);
        if (len(o) < 0.25) o = dirs.length >= 2 ? add(dirs[0], dirs[1]) : bonds.length ? anyPerp(bonds[0]) : [0.7, 0.7, 0.3];
        open.push(unit(o) || [0.7, 0.7, 0]);
        pairAxes.push(dirs.map((d, k) => unit(cross(d, bonds[0] || dirs[(k + 1) % dirs.length] || [0, 0, 1])) || anyPerp(d)));
      });
      const ringCentre = m.rings.map((ring) => ring.reduce((acc, i) => add(acc, xyz[i].map((v) => v / ring.length)), [0, 0, 0]));
      const bondOffset = m.bonds.map((b) => {
        if (b.order !== 2) return null;
        const u = unit(sub(xyz[b.b], xyz[b.a]));
        let v = null;
        if (b.ring != null) v = sub(ringCentre[b.ring], xyz[b.a]);
        else {
          const sa = this.neighbours[b.a].find((j) => j !== b.b), sb = this.neighbours[b.b].find((j) => j !== b.a);
          if (sa != null) v = sub(xyz[sa], xyz[b.a]); else if (sb != null) v = sub(xyz[sb], xyz[b.b]);
        }
        if (!v || !u) return null;
        return unit(sub(v, u.map((c) => c * dot(v, u))));
      });
      this.geo = { open, pairAxes, bondOffset };
      return this.geo;
    }

    paint() {
      const m = this.model;
      if (!m) return;
      if (!this.neighbours) {
        this.neighbours = m.atoms.map(() => []);
        for (const b of m.bonds) { this.neighbours[b.a].push(b.b); this.neighbours[b.b].push(b.a); }
      }
      const pts = this.project();
      const R = this.R;
      const s = this.s, zoom = 1 + (this.fit - 1) * s;  // labels and line spacing follow the fit-to-canvas scale
      const geo = this.geometry();
      // A 3D direction (model frame) as seen on screen now (y down); its length shrinks as it turns toward the viewer.
      const turn = (v) => [R[0][0] * v[0] + R[0][1] * v[1] + R[0][2] * v[2], -(R[1][0] * v[0] + R[1][1] * v[1] + R[1][2] * v[2])];
      // Keep a turned offset at least `least` long, growing continuously toward `fallback` as it shortens, so a
      // label never sits on its atom when its direction points at the viewer.
      const atLeast = (vx, vy, least, fx, fy) => {
        const l = Math.hypot(vx, vy);
        return l >= least ? [vx, vy] : [vx + fx * (least - l), vy + fy * (least - l)];
      };
      const fs = this.fs * zoom, bondPx = this.bondPx * zoom;
      const labels = m.atoms.map((a, i) => this.label(a, pts, i));
      const ringCentre = m.rings.map((ring) => {
        let x = 0, y = 0;
        for (const i of ring) { x += pts[i].x; y += pts[i].y; }
        return { x: x / ring.length, y: y / ring.length };
      });
      const items = m.bonds.map((b, bi) => ({ depth: (pts[b.a].z + pts[b.b].z) / 2, bond: b, bi }));
      m.atoms.forEach((_, i) => items.push({ depth: pts[i].z + 1e-4, atom: i }));
      items.sort((p, q) => p.depth - q.depth);

      // Distance from an atom's centre to the edge of its label, along direction (ux, uy).
      const trim = (i, ux, uy) => {
        const lab = labels[i];
        if (!lab) return 0;
        const hw = 0.33 * fs * lab.symbol.length + 2, hh = 0.55 * fs;
        return Math.min(Math.abs(ux) > 1e-6 ? hw / Math.abs(ux) : Infinity, Math.abs(uy) > 1e-6 ? hh / Math.abs(uy) : Infinity);
      };
      const colour = (i) => ELEMENT_COLORS[m.atoms[i].element] || INK;
      const g = svgEl("g", { "stroke-linecap": "round" });
      const line = (x1, y1, x2, y2, stroke, width, opacity) => {
        const node = svgEl("line", { x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1),
          stroke, "stroke-width": width.toFixed(2), "stroke-opacity": opacity.toFixed(2) });
        g.append(node);
        return node;
      };
      // A bond line coloured half-and-half by its end atoms, as RDKit draws it.
      const halves = (x1, y1, x2, y2, a, b, width, opacity) => {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        line(x1, y1, mx, my, colour(a), width, opacity);
        line(mx, my, x2, y2, colour(b), width, opacity);
      };

      for (const item of items) {
        const opacity = 1;
        if (item.bond) {
          const { a, b, order, ring } = item.bond;
          const p = pts[a], q = pts[b];
          const len = Math.hypot(q.x - p.x, q.y - p.y);
          if (len < 1) continue;
          const ux = (q.x - p.x) / len, uy = (q.y - p.y) / len, nx = -uy, ny = ux;
          const ta = trim(a, ux, uy), tb = trim(b, ux, uy);
          if (len <= ta + tb + 2) continue;
          const x1 = p.x + ux * ta, y1 = p.y + uy * ta, x2 = q.x - ux * tb, y2 = q.y - uy * tb;
          const gap = 0.16 * bondPx;
          let lines;  // [offset x, offset y, shorten-at-both-ends fraction]
          let second = null;  // a double bond's offset vector (screen px)
          if (order === 2) {
            // Flat: toward the ring centre (ring bonds) or a fixed side. Rotated: the bond's own plane, fixed in 3D,
            // so seen edge-on the two lines close up as a real double bond would (never below 35% of the gap).
            let fx = nx * gap, fy = ny * gap;
            if (ring != null) {
              const cx = ringCentre[ring].x - (p.x + q.x) / 2, cy = ringCentre[ring].y - (p.y + q.y) / 2;
              const sign = Math.sign(cx * nx + cy * ny || 1);
              fx *= sign; fy *= sign;
            }
            const off3 = geo.bondOffset[item.bi];
            let [tx, ty] = off3 ? turn(off3) : [fx / gap, fy / gap];
            [tx, ty] = atLeast(tx * gap, ty * gap, 0.35 * gap, Math.sign(fx * nx + fy * ny || 1) * nx, Math.sign(fx * nx + fy * ny || 1) * ny);
            second = [fx + (tx - fx) * s, fy + (ty - fy) * s];
            lines = ring != null ? [[0, 0, 0], [second[0], second[1], 0.16]]
              : [[-second[0] / 2, -second[1] / 2, 0], [second[0] / 2, second[1] / 2, 0]];
          } else if (order >= 3) {
            lines = [[-gap * nx, -gap * ny, 0], [0, 0, 0], [gap * nx, gap * ny, 0]];
          } else {
            lines = [[0, 0, 0]];
          }
          // Halo: a background-coloured stroke under the middle of the bond cuts a gap in bonds behind it.
          if (s > 0.02) {
            const keep = Math.min(0.3 * len, 0.22 * bondPx) + 1;
            const spread = Math.max(...lines.map(([ox, oy]) => Math.hypot(ox, oy)));
            if (len - ta - tb > 2 * keep) line(p.x + ux * (ta + keep), p.y + uy * (ta + keep), q.x - ux * (tb + keep), q.y - uy * (tb + keep),
                 "#ffffff", 2 * spread + 7, 1).setAttribute("data-erase", "1");
          }
          if (item.bond.dative) {
            // Coordinate bond, donor -> metal: an arrowhead just short of the metal label.
            const hx = x2, hy = y2, size = Math.max(5, 0.18 * bondPx);
            g.append(svgEl("polygon", { points: [[hx, hy], [hx - ux * size + nx * size * 0.45, hy - uy * size + ny * size * 0.45],
              [hx - ux * size - nx * size * 0.45, hy - uy * size - ny * size * 0.45]].map((pt) => pt.map((v) => v.toFixed(1)).join(",")).join(" "),
              fill: colour(b) }));
          }
          for (const [ox, oy, shorten] of lines) {
            const cut = shorten * len;
            halves(x1 + ox + ux * cut, y1 + oy + uy * cut, x2 + ox - ux * cut, y2 + oy - uy * cut,
                   a, b, 2 * zoom, opacity);  // RDKit's 2-unit lines, shrunk with the model so they keep their weight
          }
          // E/Z beside the double bond, under the same Stereo setting as R/S.
          const ez = item.bond.cip && (item.bond.arbitrary ? stereoLabels === "all" : stereoLabels !== "off");
          if (ez) {
            // On the open side of the double bond (away from its ring or substituents), turning with it.
            const flatSide = (gap + 0.45 * fs) * (ny > 0 ? -1 : 1);
            let ex = nx * flatSide, ey = ny * flatSide;
            if (second) {
              const l = Math.hypot(second[0], second[1]) || 1;
              const away = ring != null ? 1 : 0.5;
              const [tx, ty] = atLeast(-second[0] / l * (gap * away + 0.45 * fs), -second[1] / l * (gap * away + 0.45 * fs), 0.45 * fs, nx, ny);
              ex = ex + (tx - ex) * s; ey = ey + (ty - ey) * s;
            }
            const tag = svgEl("text", { x: ((p.x + q.x) / 2 + ex).toFixed(1), y: ((p.y + q.y) / 2 + ey).toFixed(1),
              "text-anchor": "middle", "dominant-baseline": "central", "font-size": Math.max(8, 0.55 * fs).toFixed(1),
              "font-family": "system-ui, sans-serif", fill: "#555555" });
            tag.textContent = item.bond.arbitrary ? `(arb. ${item.bond.cip})` : `(${item.bond.cip})`;
            if (item.bond.arbitrary) {
              const title = svgEl("title", {});
              title.textContent = "Configuration chosen for this displayed conformer; input stereochemistry unspecified";
              tag.append(title);
            }
            g.append(tag);
          }
        } else {
          const i = item.atom, atom = m.atoms[i], p = pts[i], lab = labels[i];
          const op = "1";
          if (lab) {
            const fill = ELEMENT_COLORS[lab.symbol] || INK;
            const w = 0.62 * fs * lab.symbol.length;
            g.append(svgEl("rect", { x: (p.x - w / 2 - 1).toFixed(1), y: (p.y - 0.6 * fs).toFixed(1),
              width: (w + 2).toFixed(1), height: (1.2 * fs).toFixed(1), fill: "#ffffff", "data-erase": "1" }));
            const text = (x, anchor, content, size) => {
              const t = svgEl("text", { x: x.toFixed(1), y: p.y.toFixed(1), "text-anchor": anchor, "dominant-baseline": "central",
                "font-size": size.toFixed(1), "font-family": "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
                fill, "fill-opacity": op });
              for (const [str, sub] of content) {
                const span = svgEl("tspan", sub ? { "font-size": (0.7 * size).toFixed(1), dy: sub === "sub" ? (0.25 * size).toFixed(1) : (-0.35 * size).toFixed(1) } : {});
                span.textContent = str;
                t.append(span);
              }
              g.append(t);
            };
            text(p.x, "middle", [[lab.symbol]], fs);
            if (lab.h) {
              const hText = [["H"]].concat(lab.h > 1 ? [[String(lab.h), "sub"]] : []);
              const hw = (0.62 * fs * (1 + (lab.h > 1 ? 0.6 : 0))) + 2;
              g.append(svgEl("rect", { x: (lab.hLeft ? p.x - w / 2 - hw : p.x + w / 2).toFixed(1), y: (p.y - 0.6 * fs).toFixed(1),
                width: hw.toFixed(1), height: (1.2 * fs).toFixed(1), fill: "#ffffff", "data-erase": "1" }));
              text(lab.hLeft ? p.x - w / 2 : p.x + w / 2, lab.hLeft ? "end" : "start", hText, fs);
            }
          }
          // The whole label's box (symbol and any H text), so dots, charges and tags clear all of it.
          const symW = lab ? 0.62 * fs * lab.symbol.length : 0.4 * fs;
          const hW = lab && lab.h ? 0.62 * fs * (lab.h > 1 ? 1.6 : 1) : 0;
          const lbox = { x0: p.x - symW / 2 - (lab && lab.hLeft ? hW : 0), x1: p.x + symW / 2 + (lab && !lab.hLeft ? hW : 0),
                         y0: p.y - 0.5 * fs, y1: p.y + 0.5 * fs, h: fs };
          const edge = (vx, vy) => toEdge(p.x, p.y, lbox, Math.atan2(vy, vx));  // centre to box edge, along (vx, vy)
          const labelR = lab ? 0.32 * fs * Math.max(1.5, lab.symbol.length) : 0.2 * fs;
          const open = turn(geo.open[i]);
          const electronInfo = showLonePairs && this.data.lone_pairs && this.data.lone_pairs[String(i)];
          const hasPairs = electronInfo && (electronInfo.pairs || electronInfo.radicals);
          const chargeValue = lab && lab.charge ? lab.charge : (atom.charge || 0);
          let lpDots = [];
          if (hasPairs) {
            const angles = this.neighbours[i].map((j) => Math.atan2(pts[j].y - p.y, pts[j].x - p.x));
            const w = lab ? 0.62 * fs * lab.symbol.length : 0.6 * fs;
            const hw = lab && lab.h ? 0.62 * fs * (lab.h > 1 ? 1.6 : 1) : 0;
            const box = { x0: p.x - w / 2 - (lab && lab.hLeft ? hw : 0), x1: p.x + w / 2 + (lab && !lab.hLeft ? hw : 0),
                          y0: p.y - 0.5 * fs, y1: p.y + 0.5 * fs, h: fs };
            box.symbolLength = lab ? lab.symbol.length : 1;
            const flat = electronDots(p.x, p.y, electronInfo, angles, lab ? lab.hLeft : false, box);
            // Rotated: each pair is a fixed object in 3D, like a hydrogen. It sits along its VSEPR direction, its two
            // dots split along a fixed 3D axis; seen end-on it sits over the atom, as a hydrogen pointing at you would.
            const dirs = (m.lone_pair_dirs || {})[String(i)] || [];
            const axes = geo.pairAxes[i] || [];
            let domains = flat;
            if (dirs.length === flat.length && s > 0) {
              // Pair each flat domain with the 3D direction it starts as (the model is aligned to the drawing).
              if (!this.pairing) this.pairing = {};
              if (!this.pairing[i]) {
                const left = dirs.map((d, k) => k), order = [];
                for (const f of flat) {
                  let best = 0, bestD = Infinity;
                  left.forEach((k, idx) => {
                    const a = Math.atan2(-dirs[k][1], dirs[k][0]);
                    const d = Math.abs(Math.atan2(Math.sin(a - f.angle), Math.cos(a - f.angle)));
                    if (d < bestD) { bestD = d; best = idx; }
                  });
                  order.push(left.splice(best, 1)[0]);
                }
                this.pairing[i] = order;
              }
              const h = fs, gapDots = 0.32 * h, extra = 0.14 * h + Math.max(1.6, 0.095 * h) + 0.15 * h;
              domains = flat.map((f, n) => {
                const k = this.pairing[i][n];
                const [dx, dy] = turn(dirs[k]), [qx, qy] = turn(axes[k] || [0, 0, 1]);
                // Out to the label's edge in this direction and a little beyond, scaled by how much the pair points
                // across the screen (so one pointing at the viewer sits over its atom, like a hydrogen would).
                const reach = edge(dx, dy) + extra;
                const cx = p.x + dx * reach, cy = p.y + dy * reach;
                const target = f.dots.length === 2
                  ? [[cx + qx * gapDots / 2, cy + qy * gapDots / 2], [cx - qx * gapDots / 2, cy - qy * gapDots / 2]] : [[cx, cy]];
                return { dots: f.dots.map(([fx, fy], j) => [fx + (target[j][0] - fx) * s, fy + (target[j][1] - fy) * s]) };
              });
            }
            drawDots(g, domains, fs, ELEMENT_COLORS[atom.element] || INK);
            lpDots = domains.flatMap((d) => d.dots);
          }
          // Formal charge: typography, not geometry. It is a superscript on the atom, placed on screen just outside
          // the atom's footprint (its label and its lone-pair dots), preferring the upper right and avoiding bonds,
          // and it keeps its last spot while that stays free, so it does not orbit the atom as the molecule turns.
          if (chargeValue && (lab || hasPairs)) {
            const c = (Math.abs(chargeValue) > 1 ? Math.abs(chargeValue) : "") + (chargeValue > 0 ? "+" : "−");
            const footprint = [[lbox.x0, lbox.y0], [lbox.x1, lbox.y0], [lbox.x0, lbox.y1], [lbox.x1, lbox.y1]].concat(lpDots);
            const bondAngles = this.neighbours[i].map((j) => Math.atan2(pts[j].y - p.y, pts[j].x - p.x));
            const blocked = (t) => bondAngles.some((b) => Math.abs(Math.atan2(Math.sin(t - b), Math.cos(t - b))) < 0.45);
            const candidates = [-Math.PI / 4, -Math.PI / 2, 0, -3 * Math.PI / 4, Math.PI / 4, Math.PI, 3 * Math.PI / 4, Math.PI / 2];
            if (!this.chargeAngle) this.chargeAngle = {};
            const kept = this.chargeAngle[i];
            const angle = kept != null && !blocked(kept) ? kept : (candidates.find((t) => !blocked(t)) ?? -Math.PI / 4);
            this.chargeAngle[i] = angle;
            const ux = Math.cos(angle), uy = Math.sin(angle);
            const reach = Math.max(...footprint.map(([x, y]) => (x - p.x) * ux + (y - p.y) * uy)) + 0.4 * fs;
            const t = svgEl("text", { x: (p.x + ux * reach).toFixed(1), y: (p.y + uy * reach).toFixed(1),
              "text-anchor": "middle", "dominant-baseline": "central", "font-size": (0.7 * fs).toFixed(1),
              "font-family": "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif", fill: ELEMENT_COLORS[atom.element] || INK });
            t.textContent = c;
            g.append(t);
          }
          const tags = [];
          if (this.numbering === "iupac" && this.locants[String(i)]) tags.push(this.locants[String(i)]);
          if (this.numbering === "indices" && atom.index != null) tags.push(String(i));
          // Specified: only configurations the input fixes. All: also the one this conformer happens to have at an
          // unspecified centre, marked "arb." (not R*/S*, which in IUPAC usage means relative configuration).
          const showCip = atom.cip && (atom.arbitrary ? stereoLabels === "all" : stereoLabels !== "off");
          if (showCip) tags.push(atom.arbitrary ? `(arb. ${atom.cip})` : `(${atom.cip})`);
          if (tags.length) {
            // Flat: up and to the right, as before. Rotated: in the atom's most open direction (for a stereocentre,
            // usually where its hidden hydrogen points), turning with the molecule.
            const dist = edge(open[0], open[1]) + (chargeValue ? 1.1 * fs : 0.5 * fs);
            const [ax, ay] = atLeast(open[0] * dist, open[1] * dist, edge(0.7071, -0.7071) + 0.4 * fs, 0.7071, -0.7071);
            const text = tags.join(" ");
            const fx = 0.45 * fs + 0.15 * fs * text.length, fy = -0.75 * fs;  // the flat spot, as a centre
            const tx = fx + (ax - fx) * s, ty = fy + (ay - fy) * s;
            const tag = svgEl("text", { x: (p.x + tx).toFixed(1), y: (p.y + ty).toFixed(1),
              "text-anchor": "middle", "dominant-baseline": "central",
              "font-size": Math.max(8, 0.55 * fs).toFixed(1), "font-family": "system-ui, sans-serif", fill: "#555555", "fill-opacity": op });
            tag.textContent = tags.join(" ");
            if (showCip && atom.arbitrary) {
              const title = svgEl("title", {});
              title.textContent = "Configuration chosen for this displayed conformer; input stereochemistry unspecified";
              tag.append(title);
            }
            g.append(tag);
          }
        }
      }
      this.svg.replaceChildren(svgEl("rect", { x: 0, y: 0, width: this.W, height: this.H, fill: "#ffffff" }), g);
    }
  }

  async function redraw(button, data, overrides) {
    button.disabled = true;
    // Keep showing the rotated picture until the redrawn molecule is lifted again (no flash of the flat drawing).
    const lifted = root.querySelector("svg.lift");
    liftSnapshot = lifted && lifted.style.display !== "none" ? lifted.cloneNode(true) : null;
    const args = Object.assign({}, lastInput || {}, { smiles: data.input_smiles, atom_indices: true,
                                                      numbering: data.numbering_requested || data.numbering_shown || "iupac",
                                                      hydrogens: !!data.hydrogens_shown }, overrides);
    if (data.label) args.label = data.label;
    try {
      const next = await callTool("draw_molecule", args);
      if (next && (next.structuredContent || next.isError)) render(next);
      else button.disabled = false;
    } catch (err) {
      button.disabled = false;
      button.textContent = "Redraw failed";
    }
  }

  // A structure file from export_structure: what it is, its caveats, and a Download button. The contents come in the
  // result's _meta (viewer only) or, from hosts that drop _meta, the standard embedded resource.
  function renderFile(data, meta, result) {
    const embedded = (result.content || []).find((c) => c.type === "resource" && c.resource && c.resource.text != null);
    const text = meta.file_text != null ? meta.file_text : embedded ? embedded.resource.text : null;
    const coords = data.coordinates === "3d" ? "3D coordinates (one calculated conformer, explicit H)"
      : data.coordinates === "2d" ? "2D coordinates (the drawing's layout)" : "line notation";
    const size = data.size_bytes < 1024 ? `${data.size_bytes} bytes` : `${(data.size_bytes / 1024).toFixed(1)} KB`;
    const status = el("span", { class: "status", role: "status" });
    const download = el("button", { type: "button" }, `Download ${data.filename}`);
    const card = el("div", { class: "filecard" },
      el("header", {}, el("h1", {}, data.filename), el("span", { class: "formula" }, data.format_name || "")),
      el("p", { class: "meta" }, `${data.label ? data.label + " · " : ""}${coords} · ${size}`),
      el("div", { class: "ids" }, el("span", { class: "k" }, "SMILES:"), el("code", { class: "v" }, data.canonical_smiles || "")));
    for (const w of data.warnings || []) card.append(el("p", { class: "note warn-text" }, el("strong", {}, "Stereo caveat. "), w));
    for (const n of data.notes || []) card.append(el("p", { class: "note" }, n));
    card.append(el("div", { class: "actions" }, download, status));
    if (text == null) {
      download.disabled = true;
      status.textContent = "The file contents did not reach the viewer; ask for the file again.";
    }
    download.addEventListener("click", async () => {
      download.disabled = true;
      try {
        const outcome = await saveFile({ name: data.filename, mime: data.mime_type || "text/plain", text });
        status.textContent = outcome === "saved" ? "Saved" : outcome === "cancelled" ? "Download cancelled" : "";
      } finally { download.disabled = false; }
    });
    root.append(card);
  }

  function renderIsomers(data, meta) {
    const isomers = data.isomers || [];
    const svgs = meta.svgs || [];
    root.append(el("header", {}, el("h1", {}, `${isomers.length} stereoisomer${isomers.length === 1 ? "" : "s"}`),
                   el("code", { class: "formula" }, data.input_smiles || "")));
    const grid = el("div", { class: "grid" });
    isomers.forEach((iso, i) => {
      const cip = (iso.stereocenters || []).map((c) => `${c.atom_index}${c.cip}`).join(", ");
      const ez = (iso.double_bond_stereo || []).map((b) => b.configuration).join(", ");
      const relation = iso.achiral ? "achiral (meso)" : iso.enantiomer_index != null ? `enantiomer of #${iso.enantiomer_index}` : "";
      grid.append(el("div", { class: "card" },
        svgs[i] ? canvas(svgs[i], "Stereoisomer " + iso.smiles) : null,
        el("p", {}, el("strong", {}, `#${iso.index} `), [cip, ez].filter(Boolean).join("; ") || "—", relation ? ` · ${relation}` : ""),
        el("p", {}, el("code", {}, iso.smiles))));
    });
    root.append(grid);
    if (data.truncated) root.append(el("p", { class: "note" }, "List truncated at the requested limit."));
    if (isomers.length > svgs.length) root.append(el("p", { class: "note" }, `Only the first ${svgs.length} isomers are drawn.`));
    root.append(el("p", { class: "note" }, "Labels use zero-based input atom indices (e.g. 1R = atom 1 is R)."));
  }
  // Only now: ChatGPT may have injected window.openai before this script ran, and rendering needs every
  // declaration above (classes are not hoisted).
  fromOpenAiGlobals();
})();
</script>
</body>
